function norm(s){return (s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9\s]/g,'').replace(/\s+/g,' ').trim()}
function lev(a,b){if(!a)return b.length;if(!b)return a.length;const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c)}return d[a.length][b.length]}
function sim(a,b){const s=norm(a),t=norm(b);if(!s||!t)return 0;const d=lev(s,t);return Math.round((1-d/Math.max(s.length,t.length))*100)}

function rfcMatch(r1,r2){if(!r1||!r2)return false;if(r1==='no aplica'||r2==='no aplica')return false;return norm(r1)===norm(r2)}

function findExcelMatch(odooItem){
  let best=null,bestScore=-1;
  for(const ex of EXCEL){
    let score=sim(odooItem.empresa,ex.name);
    if(rfcMatch(odooItem.rfc,ex.rfc))score=Math.max(score,95);
    if(score>bestScore){bestScore=score;best=ex}
  }
  return {match:bestScore>=50?best:null,score:bestScore}
}

const ENRICHED = ODOO.map(o=>{
  const {match,score}=findExcelMatch(o);
  return {...o,excelMatch:match,matchScore:score}
});

const EXCEL_ONLY = EXCEL.filter(ex=>{
  const matched = ENRICHED.some(o=>o.excelMatch&&o.excelMatch.name===ex.name);
  return !matched;
});

let expanded={};

function getStatus(item){
  if(!item.excelMatch)return 'none';
  if(item.matchScore>=90)return 'ok';
  return 'partial';
}

function render(){
  const q=norm(document.getElementById('search').value);
  const f=document.getElementById('filter').value;
  const tbody=document.getElementById('tbody');

  let rows=[];

  if(f!=='excel_only'){
    let items=ENRICHED;
    if(f==='matched')items=items.filter(i=>getStatus(i)==='ok');
    else if(f==='partial')items=items.filter(i=>getStatus(i)==='partial');
    else if(f==='unmatched')items=items.filter(i=>getStatus(i)==='none');
    if(q)items=items.filter(i=>norm(i.empresa).includes(q)||norm(i.rfc).includes(q)||i.contacts.some(c=>norm(c.name).includes(q)));
    rows=items.map(item=>renderOdooRow(item));
  }

  if(f==='all'||f==='excel_only'){
    let exItems=EXCEL_ONLY;
    if(q)exItems=exItems.filter(ex=>norm(ex.name).includes(q)||norm(ex.rfc).includes(q));
    rows=rows.concat(exItems.map(ex=>renderExcelOnlyRow(ex)));
  }

  tbody.innerHTML=rows.join('');

  const total=ENRICHED.length;
  const matched=ENRICHED.filter(i=>getStatus(i)==='ok').length;
  const partial=ENRICHED.filter(i=>getStatus(i)==='partial').length;
  const none=ENRICHED.filter(i=>getStatus(i)==='none').length;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-n">${total}</div><div class="stat-l">Odoo (visibles)</div></div>
    <div class="stat"><div class="stat-n" style="color:#3B6D11">${matched}</div><div class="stat-l">Match exacto</div></div>
    <div class="stat"><div class="stat-n" style="color:#854F0B">${partial}</div><div class="stat-l">Match parcial</div></div>
    <div class="stat"><div class="stat-n" style="color:#A32D2D">${none}</div><div class="stat-l">Sin match Excel</div></div>
    <div class="stat"><div class="stat-n" style="color:#185FA5">${EXCEL_ONLY.length}</div><div class="stat-l">Solo en Excel</div></div>
  `;
}

function renderOdooRow(item){
  const st=getStatus(item);
  const badgeMap={ok:'<span class="badge b-ok">Exacto</span>',partial:'<span class="badge b-partial">'+item.matchScore+'%</span>',none:'<span class="badge b-none">Sin match</span>'};
  const badge=badgeMap[st];
  const contactsHtml=item.contacts.length?`<div class="contacts">${item.contacts.map(c=>`<i class="ti ti-user" style="font-size:10px" aria-hidden="true"></i> ${c.name}${c.puesto?' · '+c.puesto:''}${c.email?' · '+c.email:''}`).join('<br>')}</div>`:'';
  const sheets=item.excelMatch?.sheets||[];
  const sheetsHtml=sheets.length?`<div class="sheets">${sheets.slice(0,3).map(s=>`<span class="sheet-tag">${s}</span>`).join('')}${sheets.length>3?`<span class="sheet-tag">+${sheets.length-3}</span>`:''}</div>`:'<span style="color:var(--color-text-tertiary);font-size:11px">—</span>';
  const matchName=item.excelMatch?`<div style="font-size:11px;color:var(--color-text-secondary);margin-top:2px">${item.excelMatch.name}</div>`:'';
  const rfcDisplay=item.rfc&&item.rfc!=='no aplica'&&item.rfc!='GODE561231GR8'?`<div class="rfc-small">${item.rfc}</div>`:`<span style="color:var(--color-text-tertiary);font-size:11px">${item.rfc||'—'}</span>`;
  const tipo=item.tipo==='Empresa'?'':`<span class="badge b-odoo" style="margin-left:4px">persona</span>`;
  const kms=item.excelMatch?.c1||0;
  const costo=item.excelMatch?.c6||0;

  return `<tr>
    <td class="col-empresa"><span style="font-weight:500">${item.empresa}</span>${tipo}</td>
    <td class="col-odoo">${item.email?`<div style="font-size:11px;color:var(--color-text-secondary)">${item.email}</div>`:''}${item.tel?`<div style="font-size:11px;color:var(--color-text-secondary)">${item.tel}</div>`:''}${contactsHtml}</td>
    <td class="col-rfc">${rfcDisplay}</td>
    <td class="col-match">${badge}${matchName}</td>
    <td class="col-kms" style="text-align:right">${kms?kms.toFixed(1):'—'}</td>
    <td class="col-costo" style="text-align:right">${costo?'$'+costo.toFixed(0):'—'}</td>
    <td class="col-sheets">${sheetsHtml}</td>
  </tr>`;
}

function renderExcelOnlyRow(ex){
  const sheetsHtml=ex.sheets.length?`<div class="sheets">${ex.sheets.slice(0,3).map(s=>`<span class="sheet-tag">${s}</span>`).join('')}${ex.sheets.length>3?`<span class="sheet-tag">+${ex.sheets.length-3}</span>`:''}</div>`:'—';
  return `<tr style="opacity:0.7">
    <td class="col-empresa"><span style="font-weight:500">${ex.name}</span> <span class="badge b-odoo">solo Excel</span></td>
    <td class="col-odoo" style="color:var(--color-text-tertiary);font-size:11px">Sin registro Odoo</td>
    <td class="col-rfc"><div class="rfc-small">${ex.rfc||'—'}</div></td>
    <td class="col-match"><span class="badge b-none">Solo Excel</span></td>
    <td class="col-kms" style="text-align:right">${ex.c1||'—'}</td>
    <td class="col-costo" style="text-align:right">${ex.c6?'$'+ex.c6.toFixed(0):'—'}</td>
    <td class="col-sheets">${sheetsHtml}</td>
  </tr>`;
}

render();
</script>
