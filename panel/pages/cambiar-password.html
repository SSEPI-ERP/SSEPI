<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/panel/assets/logo-ssepi.png">
  <link rel="shortcut icon" type="image/png" href="/panel/assets/logo-ssepi.png">
  <title>SSEPI · Cambiar contraseña</title>
  <link rel="stylesheet" href="/panel/css/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/panel/js/core/config.runtime.js"></script>
  <script src="/panel/js/core/password-policy.js"></script>
  <script type="module" src="/panel/js/core/supabase-config.js"></script>
  <style>
    body { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    main { max-width: 560px; margin: 0 auto; padding: 30px; }
    .card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 22px; }
    .title { font-size: 20px; font-weight: 900; margin-bottom: 10px; }
    .muted { color: var(--text-muted); font-size: 13px; line-height: 1.4; margin-bottom: 16px; }
    .row { display: grid; gap: 8px; margin-bottom: 12px; }
    .row label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; }
    .row input { width: 100%; box-sizing: border-box; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--bg-input, #fff); color: var(--text-primary, #111); }
    .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:14px; flex-wrap: wrap; }
    .banner { display:none; margin-top: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-hover); font-size: 13px; }
    .banner.ok { border-color: rgba(46,125,50,.35); background: rgba(46,125,50,.10); }
    .banner.err { border-color: rgba(198,40,40,.35); background: rgba(198,40,40,.10); }
    .req-list { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 4px; }
    .req-list li { font-size: 12px; color: var(--text-muted); display: flex; gap: 6px; align-items: center; }
    .req-list li i { width: 14px; text-align: center; }
    .req-list li.ok { color: #2e7d32; }
    .req-list li.bad { color: #c62828; }
    .force-banner { display:none; margin-bottom: 14px; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(198,40,40,.35); background: rgba(198,40,40,.08); font-size: 13px; }
  </style>
</head>
<body class="page-panel">
  <main>
    <div class="card">
      <div class="title"><i class="fas fa-key"></i> Cambiar contraseña</div>
      <div class="muted">
        Define una contraseña fuerte para tu cuenta. Debe cumplir todos los requisitos de seguridad.
      </div>

      <div class="force-banner" id="forceBanner">
        <i class="fas fa-shield-halved"></i> Tu administrador solicitó que cambies tu contraseña antes de continuar.
      </div>

      <div class="row">
        <label>Cuenta</label>
        <div id="accountEmail" class="muted" style="margin:0;font-weight:600;color:var(--text-primary)">…</div>
      </div>

      <div class="row">
        <label for="pass1">Nueva contraseña</label>
        <input id="pass1" type="password" autocomplete="new-password" placeholder="Nueva contraseña" />
        <ul class="req-list" id="reqList"></ul>
      </div>
      <div class="row">
        <label for="pass2">Repetir nueva contraseña</label>
        <input id="pass2" type="password" autocomplete="new-password" placeholder="Repite la nueva contraseña" />
      </div>

      <div class="actions">
        <a class="btn-ssepi btn-secondary" href="/panel/panel.html" id="cancelLink"><i class="fas fa-arrow-left"></i> Cancelar</a>
        <button class="btn-ssepi" type="button" id="saveBtn" disabled><i class="fas fa-save"></i> Guardar contraseña</button>
      </div>

      <div class="banner" id="msg"></div>
    </div>
  </main>

  <script>
    window.addEventListener('load', function () {
      var params = new URLSearchParams(window.location.search);
      var forced = params.get('forced') === '1';
      var msg = document.getElementById('msg');
      var saveBtn = document.getElementById('saveBtn');
      var pass1 = document.getElementById('pass1');
      var pass2 = document.getElementById('pass2');
      var accountEmailEl = document.getElementById('accountEmail');
      var reqList = document.getElementById('reqList');
      var forceBanner = document.getElementById('forceBanner');
      var cancelLink = document.getElementById('cancelLink');
      var userEmail = '';
      var userName = '';

      if (forced) {
        forceBanner.style.display = 'block';
        if (cancelLink) cancelLink.style.display = 'none'; // no escapar del cambio forzado
      }

      function show(text, kind) {
        msg.className = 'banner ' + (kind || '');
        msg.textContent = text;
        msg.style.display = 'block';
      }

      // Render inicial de requisitos
      function renderReq(pw) {
        var res = window.validarPasswordFuerte(pw || '');
        var html = res.requisitos.map(function (r) {
          var cls = r.ok ? 'ok' : 'bad';
          var ic = r.ok ? '<i class="fas fa-check"></i>' : '<i class="fas fa-circle"></i>';
          return '<li class="' + cls + '">' + ic + ' ' + r.label + '</li>';
        }).join('');
        reqList.innerHTML = html;
        var coinciden = pass2.value.length > 0 && pass1.value === pass2.value;
        saveBtn.disabled = !(res.valid && coinciden);
      }

      pass1.addEventListener('input', function () { renderReq(pass1.value); });
      pass2.addEventListener('input', function () { renderReq(pass1.value); });

      async function ensureSupabase() {
        var deadline = Date.now() + 8000;
        while (!window.supabase && Date.now() < deadline) {
          await new Promise(function (r) { setTimeout(r, 50); });
        }
        if (!window.supabase) throw new Error('Supabase no está disponible.');
      }

      ensureSupabase().then(async function () {
        var { data: { user }, error } = await window.supabase.auth.getUser();
        if (error || !user) {
          show('No hay sesión activa. Inicia sesión para cambiar tu contraseña.', 'err');
          saveBtn.disabled = true;
          return;
        }
        userEmail = user.email || '';
        userName = (user.user_metadata && (user.user_metadata.nombre || user.user_metadata.name)) || '';
        accountEmailEl.textContent = userEmail;

        // Si no viene forzado, verificar si la cuenta tiene must_change_password (UX)
        try {
          var { data: uRow } = await window.supabase
            .from('usuarios')
            .select('must_change_password, nombre')
            .eq('auth_user_id', user.id)
            .maybeSingle();
          if (uRow && uRow.must_change_password) {
            forced = true;
            forceBanner.style.display = 'block';
            if (cancelLink) cancelLink.style.display = 'none';
          }
          if (uRow && uRow.nombre) userName = uRow.nombre;
        } catch (e) { /* columna ausente en modo local: ignorar */ }

        renderReq('');
      }).catch(function (e) {
        show((e && e.message) ? e.message : String(e), 'err');
      });

      saveBtn.addEventListener('click', async function () {
        try {
          var p1 = (pass1.value || '');
          var p2 = (pass2.value || '');

          var res = window.validarPasswordFuerte(p1);
          if (!res.valid) {
            show('La contraseña no cumple: ' + res.errores.join('; '), 'err');
            return;
          }
          if (p1 !== p2) {
            show('Las contraseñas no coinciden.', 'err');
            return;
          }
          if (window.passwordPolicyContieneDatosUsuario && window.passwordPolicyContieneDatosUsuario(p1, userEmail, userName)) {
            show('La contraseña no puede contener tu correo o nombre.', 'err');
            return;
          }

          saveBtn.disabled = true;
          saveBtn.textContent = 'Guardando…';

          // 1) Actualizar password en Auth
          var { error } = await window.supabase.auth.updateUser({ password: p1 });
          if (error) throw error;

          // Marca de sesión: el password sí cambió. Evita bucle de redirección si
          // el UPDATE de must_change_password fallara por RLS/columna ausente.
          try { sessionStorage.setItem('ssepi_pwd_changed', '1'); } catch (e3) {}

          // 2) Limpiar la marca must_change_password (graceful: si la columna
          //    no existe o RLS lo impide, no bloquea el cambio de password).
          try {
            var { data: u } = await window.supabase.auth.getUser();
            await window.supabase
              .from('usuarios')
              .update({ must_change_password: false })
              .eq('auth_user_id', u && u.user && u.user.id);
          } catch (e2) { /* no crítico: la marca de sesión evita el bucle */ }

          show('Contraseña actualizada. Redirigiendo al panel…', 'ok');
          setTimeout(function () {
            window.location.href = '/panel/panel.html';
          }, 900);
        } catch (e) {
          show((e && e.message) ? e.message : String(e), 'err');
          saveBtn.disabled = false;
          saveBtn.innerHTML = '<i class="fas fa-save"></i> Guardar contraseña';
        }
      });
    });
  </script>
</body>
</html>
