<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSEPI - PDFs y Políticas por Módulo</title>
    <!-- Configuración centralizada de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/panel/js/core/supabase-config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --teal: #17a598;
            --teal-dark: #0d9488;
            --teal-light: #e8f6f4;
            --bg-dark: #0f172a;
            --bg-card: rgba(255,255,255,0.97);
            --glass: rgba(255,255,255,0.06);
            --glass-border: rgba(255,255,255,0.1);
            --shadow-soft: 0 8px 32px rgba(0,0,0,0.25);
            --shadow-hover: 0 20px 60px rgba(0,0,0,0.35);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(ellipse at 0% 0%, #16213e 0%, #0f172a 50%, #1a1a2e 100%);
            min-height: 100vh;
            padding: 24px;
            color: #333;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* Header */
        header {
            position: relative;
            padding: 36px 40px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            margin-bottom: 36px;
            overflow: hidden;
        }
        header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(23,165,152,0.15) 0%, transparent 70%);
            pointer-events: none;
        }
        header h1 {
            color: #fff;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        header h1 span { color: var(--teal); }
        header p {
            color: rgba(255,255,255,0.55);
            font-size: 1.05rem;
            font-weight: 400;
        }
        .header-actions { display: flex; gap: 12px; align-items: center; }

        /* Grid */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 28px;
            margin-bottom: 48px;
        }
        @media (max-width: 640px) {
            .modules-grid { grid-template-columns: 1fr; }
        }

        /* Card */
        .module-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 0;
            box-shadow: var(--shadow-soft);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(0,0,0,0.04);
            overflow: hidden;
            position: relative;
        }
        .module-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--teal), var(--teal-dark));
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .module-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: var(--shadow-hover);
        }
        .module-card:hover::after { opacity: 1; }

        .module-card-inner { padding: 28px; }
        .module-header {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 20px;
        }
        .module-icon {
            width: 60px;
            height: 60px;
            min-width: 60px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        .module-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 60%);
            border-radius: inherit;
        }
        .module-title { flex: 1; }
        .module-title h2 {
            font-size: 1.35rem;
            color: #1a1a2e;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .module-title .tiempo-entrega {
            font-size: 0.88rem;
            color: var(--teal);
            font-weight: 600;
            background: var(--teal-light);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .garantia-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #7c3a00;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(252,182,159,0.3);
        }

        .politicas-section { margin-bottom: 18px; }
        .politicas-section h3 {
            font-size: 0.95rem;
            color: var(--teal);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nota-item {
            padding: 12px 14px;
            background: #f8fafc;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #374151;
            border-left: 3px solid var(--teal);
            line-height: 1.5;
            transition: background 0.2s;
        }
        .nota-item:hover { background: #f1f5f9; }
        .nota-item strong { color: var(--teal-dark); font-weight: 700; }
        .nota-item .nota-num {
            display: inline-block;
            min-width: 22px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            background: var(--teal);
            color: white;
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: 700;
            margin-right: 8px;
            vertical-align: middle;
        }
        .nota-empty {
            color: #9ca3af;
            font-style: italic;
            padding: 12px;
            text-align: center;
        }

        .pdf-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
            padding-top: 18px;
            border-top: 1px solid #e5e7eb;
        }

        /* Buttons */
        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--teal), var(--teal-dark));
            color: white;
            box-shadow: 0 4px 14px rgba(23,165,152,0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(23,165,152,0.45);
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
            border-color: #cbd5e1;
        }
        .btn-edit {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 4px 14px rgba(59,130,246,0.3);
        }
        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59,130,246,0.4);
        }
        .btn-save {
            background: linear-gradient(135deg, var(--teal), var(--teal-dark));
            color: white;
        }
        .btn-cancel {
            background: #f1f5f9;
            color: #475569;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.6);
        }
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--teal);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
            color: #991b1b;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            border: 1px solid #fecaca;
            font-weight: 500;
        }
        .success-msg {
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            color: #166534;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            border: 1px solid #bbf7d0;
            font-weight: 500;
        }

        /* Login Screen (hidden) */
        .login-screen { display: none !important; }

        /* Modal Editor */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: var(--radius-lg);
            padding: 32px;
            max-width: 720px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow-hover);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f1f5f9;
        }
        .modal-header h2 {
            color: #1a1a2e;
            font-size: 1.4rem;
            font-weight: 700;
        }
        .modal-close {
            background: #f1f5f9;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #64748b;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .modal-close:hover { background: #e2e8f0; color: #334155; }
        .form-group { margin-bottom: 22px; }
        .form-group label {
            display: block;
            font-weight: 700;
            color: #374151;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            background: #fafbfc;
            transition: all 0.2s;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--teal);
            background: white;
            box-shadow: 0 0 0 3px rgba(23,165,152,0.1);
        }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .nota-editor-item {
            background: #f8fafc;
            padding: 14px;
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
        }
        .nota-editor-item textarea {
            width: 100%;
            min-height: 56px;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px solid #f1f5f9;
        }

        /* Preview Modal */
        .preview-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .preview-overlay.active { display: flex; }
        .preview-box {
            background: white;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 960px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-hover);
            animation: modalIn 0.3s ease;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
        }
        .preview-header h3 { margin: 0; font-size: 1.1rem; font-weight: 600; }
        .preview-frame { flex: 1; border: none; width: 100%; background: #f8fafc; }
        .preview-actions {
            display: flex;
            gap: 12px;
            padding: 14px 24px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 36px;
            color: rgba(255,255,255,0.4);
            font-size: 0.88rem;
        }
        footer a { color: var(--teal); text-decoration: none; font-weight: 600; }
        footer a:hover { text-decoration: underline; }

        /* Info bar inside card */
        .card-infobar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .info-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
        }
        .chip-teal { background: var(--teal-light); color: var(--teal-dark); }
        .chip-amber { background: #fffbeb; color: #b45309; }
        .chip-blue { background: #eff6ff; color: #1d4ed8; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
                <div>
                    <h1><span>SSEPI</span> — PDFs y Políticas</h1>
                    <p>Genera documentos profesionales con las políticas actualizadas de cada departamento</p>
                </div>
                <button onclick="window.location.href='/panel/panel.html'" class="btn btn-secondary" style="max-width:200px;">
                    🏠 Volver al Panel
                </button>
            </div>
        </header>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Cargando políticas desde la base de datos...</p>
        </div>

        <div id="error" class="error-msg" style="display:none;"></div>
        <div id="success" class="success-msg" style="display:none;"></div>

        <div id="modulesGrid" class="modules-grid" style="display:none;"></div>

        <footer>
            <p>SSEPI — Soluciones de Servicios Enterprise · <a href="https://www.ssepi.org/terms" target="_blank">Términos y condiciones</a></p>
        </footer>
    </div>

    <!-- Modal Vista Previa PDF -->
    <div id="previewModal" class="preview-overlay">
        <div class="preview-box">
            <div class="preview-header">
                <h3 id="previewTitle">👁️ Vista previa del PDF</h3>
                <button onclick="cerrarVistaPrevia()" style="background:none;border:none;color:white;font-size:24px;cursor:pointer;">&times;</button>
            </div>
            <iframe id="previewFrame" class="preview-frame"></iframe>
            <div class="preview-actions">
                <button class="btn btn-primary" onclick="descargarPDFDesdePreview()">
                    ⬇️ Descargar PDF
                </button>
                <button class="btn btn-cancel" onclick="cerrarVistaPrevia()">
                    ❌ Cerrar
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Editor de Políticas -->
    <div id="editorModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">✏️ Editar Políticas</h2>
                <button class="modal-close" onclick="cerrarEditor()">&times;</button>
            </div>

            <div class="form-group">
                <label>Módulo</label>
                <input type="text" id="editModulo" readonly>
            </div>

            <div class="form-group">
                <label>Título</label>
                <input type="text" id="editTitulo" placeholder="Ej: Políticas para reparación de...">
            </div>

            <div class="form-group">
                <label>Tiempo de entrega</label>
                <input type="text" id="editTiempoEntrega" placeholder="Ej: INMEDIATA a partir de la OC">
            </div>

            <div class="form-group">
                <label>Garantía (días)</label>
                <input type="number" id="editGarantiaDias" min="0" max="365">
            </div>

            <div class="form-group">
                <label>Moneda</label>
                <input type="text" id="editMoneda" placeholder="Ej: MONEDA NACIONAL">
            </div>

            <div class="form-group">
                <label>URL de términos</label>
                <input type="url" id="editUrlTerminos" placeholder="https://www.ssepi.org/terms">
            </div>

            <div class="form-group">
                <label>Notas Importantes (usa **texto** para negritas)</label>
                <div id="notasEditor"></div>
                <button type="button" class="btn btn-secondary" onclick="agregarNota()" style="margin-top: 10px;">
                    ➕ Agregar nota
                </button>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-save" onclick="guardarPoliticas()">
                    💾 Guardar cambios
                </button>
                <button type="button" class="btn btn-cancel" onclick="cerrarEditor()">
                    ❌ Cancelar
                </button>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════
        // CONFIGURACIÓN DE SUPABASE
        // Usa la configuración centralizada de supabase-config.js
        // ═══════════════════════════════════════════════════════════════════
        const sb = window.supabase;
        const { jsPDF } = window.jspdf;

        let politicasData = {};
        let moduloActualEditando = null;
        let usuarioActual = null;

        // ═══════════════════════════════════════════════════════════════════
        // SESIÓN (heredada del panel — si no hay sesión, redirige al panel)
        // ═══════════════════════════════════════════════════════════════════
        async function verificarSesion() {
            try {
                const { data } = await sb.auth.getSession();
                if (data?.session) {
                    usuarioActual = data.session.user;
                    _entrarModulo();
                    return;
                }
            } catch (e) {
                console.warn('[PDFs] getSession falló:', e.message);
            }

            // Fallback: verificar token en localStorage (el panel usa Supabase Auth)
            const hasToken = !!localStorage.getItem('sb-knzmdwjmrhcoytmebdwa-auth-token') ||
                             !!localStorage.getItem('sb-foytizbicwnndegeorny-auth-token');
            if (hasToken && sb) {
                try {
                    const { data: { user }, error } = await sb.auth.getUser();
                    if (user && !error) {
                        usuarioActual = user;
                        _entrarModulo();
                        return;
                    }
                } catch (e) {
                    console.warn('[PDFs] getUser fallback falló:', e.message);
                }
            }

            // Sin sesión: redirigir al panel (que maneja login centralizado)
            window.location.replace('/panel/panel.html');
        }

        function _entrarModulo() {
            cargarPoliticas().then(ok => {
                if (ok) renderModules();
            });
            document.getElementById('loading').style.display = 'none';
        }

        // ═══════════════════════════════════════════════════════════════════
        // DATOS DE MÓDULOS
        // ═══════════════════════════════════════════════════════════════════
        const MODULES = [
            {
                id: 'taller_electronica',
                nombre: 'Taller Electrónica',
                icon: '🔧',
                color: '#467d32',
                colorHex: [70, 125, 50]
            },
            {
                id: 'taller_motores',
                nombre: 'Taller Motores',
                icon: '⚙️',
                color: '#ef6c00',
                colorHex: [239, 108, 0]
            },
            {
                id: 'ventas_suministros',
                nombre: 'Ventas y Suministros',
                icon: '📦',
                color: '#ff9800',
                colorHex: [255, 152, 0]
            },
            {
                id: 'automatizacion',
                nombre: 'Automatización',
                icon: '🤖',
                color: '#6a1b9a',
                colorHex: [106, 27, 154]
            },
            {
                id: 'soporte_planta',
                nombre: 'Soporte a Planta',
                icon: '🛠️',
                color: '#d32f2f',
                colorHex: [211, 47, 47]
            }
        ];

        // ═══════════════════════════════════════════════════════════════════
        // POLÍTICAS DEFAULT (fallback si la BD está vacía)
        // Usa **texto** para negritas en las notas
        // ═══════════════════════════════════════════════════════════════════
        const POLITICAS_DEFAULT = {
            taller_electronica: {
                titulo: 'Políticas para reparación de equipos electrónicos',
                tiempo_entrega: 'INMEDIATA a partir de la OC',
                garantia_dias: 30,
                moneda: 'MONEDA NACIONAL',
                url_terminos: 'https://www.ssepi.org/terms',
                notas_importantes: [
                    'SSEPI ofrece **garantía de la unidad** por un período de 30 días, contando a partir de la fecha de entrega. La garantía aplica **únicamente** sobre la falla reparada y los componentes reemplazados durante el servicio realizado.',

        // ═══════════════════════════════════════════════════════════════════
        // CARGAR POLÍTICAS DESDE BD
        // ═══════════════════════════════════════════════════════════════════
        async function cargarPoliticas() {
            try {
                const { data, error } = await supabase
                    .from('politicas_modulos')
                    .select('*')
                    .eq('activo', true);

                if (error) throw error;

                politicasData = {};
                // Primero poblar con defaults
                Object.keys(POLITICAS_DEFAULT).forEach(mod => {
                    politicasData[mod] = { ...POLITICAS_DEFAULT[mod], modulo: mod, activo: true };
                });
                // Luego sobrescribir con datos de BD si existen
                (data || []).forEach(p => {
                    politicasData[p.modulo] = { ...politicasData[p.modulo], ...p };
                });

                return true;
            } catch (e) {
                console.error('Error cargando políticas:', e);
                mostrarError('Error cargando políticas: ' + e.message);
                // Fallback total: usar solo defaults
                Object.keys(POLITICAS_DEFAULT).forEach(mod => {
                    politicasData[mod] = { ...POLITICAS_DEFAULT[mod], modulo: mod, activo: true };
                });
                return true;
            }
        }

        // ═══════════════════════════════════════════════════════════════════
        // MOSTRAR MENSAJES
        // ═══════════════════════════════════════════════════════════════════
        function mostrarError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }

        function mostrarSuccess(msg) {
            const el = document.getElementById('success');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        // ═══════════════════════════════════════════════════════════════════
        // RENDERIZAR MÓDULOS
        // ═══════════════════════════════════════════════════════════════════
        function renderModules() {
            const grid = document.getElementById('modulesGrid');
            grid.innerHTML = '';

            MODULES.forEach(mod => {
                const políticas = politicasData[mod.id];
                const notas = políticas?.notas_importantes || [];

                // Renderizar notas con número en círculo y soporte para **bold**
                const notasHtml = notas.length ? notas.map((nota, i) => {
                    const html = nota
                        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\n/g, '<br>');
                    return `<div class="nota-item"><span class="nota-num">${i + 1}</span>${html}</div>`;
                }).join('') : '<p class="nota-empty">Sin políticas configuradas</p>';

                const chipsHtml = [];
                if (políticas?.tiempo_entrega) chipsHtml.push(`<span class="info-chip chip-teal">⏱ ${políticas.tiempo_entrega}</span>`);
                if (políticas?.moneda) chipsHtml.push(`<span class="info-chip chip-blue">💰 ${políticas.moneda}</span>`);
                if (políticas?.garantia_dias && políticas.garantia_dias > 0) chipsHtml.push(`<span class="info-chip chip-amber">📋 ${políticas.garantia_dias} días garantía</span>`);

                const card = document.createElement('div');
                card.className = 'module-card';
                card.innerHTML = `
                    <div class="module-card-inner">
                        <div class="module-header">
                            <div class="module-icon" style="background: ${mod.color}">${mod.icon}</div>
                            <div class="module-title">
                                <h2>${mod.nombre}</h2>
                                <div class="tiempo-entrega">${políticas?.tiempo_entrega || 'N/A'}</div>
                            </div>
                        </div>

                        ${chipsHtml.length ? `<div class="card-infobar">${chipsHtml.join('')}</div>` : ''}

                        <div class="politicas-section">
                            <h3>📌 Políticas</h3>
                            ${notasHtml}
                        </div>

                        <div class="pdf-actions">
                            <button class="btn btn-primary" onclick="generarPDF('${mod.id}', true)">
                                👁️ Vista previa
                            </button>
                            <button class="btn btn-secondary" onclick="generarPDF('${mod.id}')">
                                ⬇️ Descargar
                            </button>
                            <button class="btn btn-edit" onclick="abrirEditor('${mod.id}')">
                                ✏️ Editar
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            grid.style.display = 'grid';
            document.getElementById('loading').style.display = 'none';
        }

        // ═══════════════════════════════════════════════════════════════════
        // ABRIR/CERRAR EDITOR
        // ═══════════════════════════════════════════════════════════════════
        function abrirEditor(moduloId) {
            const mod = MODULES.find(m => m.id === moduloId);
            const politicas = politicasData[moduloId];

            if (!mod) return;

            moduloActualEditando = moduloId;

            document.getElementById('editModulo').value = mod.nombre;
            document.getElementById('editTitulo').value = politicas?.titulo || '';
            document.getElementById('editTiempoEntrega').value = politicas?.tiempo_entrega || '';
            document.getElementById('editGarantiaDias').value = politicas?.garantia_dias || 0;
            document.getElementById('editMoneda').value = politicas?.moneda || 'MONEDA NACIONAL';
            document.getElementById('editUrlTerminos').value = politicas?.url_terminos || '';

            // Notas
            const notasContainer = document.getElementById('notasEditor');
            notasContainer.innerHTML = '';

            const notas = politicas?.notas_importantes || [];
            notas.forEach((nota, idx) => {
                agregarNotaEditor(nota);
            });

            document.getElementById('modalTitle').textContent = `✏️ Editar: ${mod.nombre}`;
            document.getElementById('editorModal').classList.add('active');
        }

        function cerrarEditor() {
            document.getElementById('editorModal').classList.remove('active');
            moduloActualEditando = null;
        }

        function agregarNota() {
            agregarNotaEditor('');
        }

        function agregarNotaEditor(texto = '') {
            const container = document.getElementById('notasEditor');
            const div = document.createElement('div');
            div.className = 'nota-editor-item';
            div.innerHTML = `
                <textarea placeholder="Escribe la nota aquí...">${texto}</textarea>
                <button type="button" class="btn btn-cancel" onclick="this.parentElement.remove()" style="margin-top: 5px; padding: 6px 12px; font-size: 12px;">
                    🗑️ Eliminar
                </button>
            `;
            container.appendChild(div);
        }

        // ═══════════════════════════════════════════════════════════════════
        // GUARDAR POLÍTICAS
        // ═══════════════════════════════════════════════════════════════════
        async function guardarPoliticas() {
            if (!moduloActualEditando) return;

            const titulo = document.getElementById('editTitulo').value.trim();
            const tiempoEntrega = document.getElementById('editTiempoEntrega').value.trim();
            const garantiaDias = parseInt(document.getElementById('editGarantiaDias').value) || 0;
            const moneda = document.getElementById('editMoneda').value.trim();
            const urlTerminos = document.getElementById('editUrlTerminos').value.trim();

            // Obtener notas
            const notas = [];
            document.querySelectorAll('#notasEditor textarea').forEach(el => {
                const texto = el.value.trim();
                if (texto) notas.push(texto);
            });

            if (!titulo || !tiempoEntrega) {
                alert('El título y tiempo de entrega son requeridos');
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('politicas_modulos')
                    .upsert({
                        modulo: moduloActualEditando,
                        titulo,
                        tiempo_entrega: tiempoEntrega,
                        garantia_dias: garantiaDias,
                        moneda,
                        url_terminos: urlTerminos,
                        notas_importantes: notas,
                        updated_at: new Date().toISOString()
                    }, {
                        onConflict: 'modulo'
                    })
                    .select()
                    .single();

                if (error) throw error;

                // Actualizar caché local
                politicasData[moduloActualEditando] = data;

                // Re-renderizar
                renderModules();

                mostrarSuccess('Políticas guardadas correctamente');
                cerrarEditor();
            } catch (e) {
                console.error('Error guardando políticas:', e);
                alert('Error guardando: ' + e.message);
            }
        }

            const mod = MODULES.find(m => m.id === moduloId);
            const politicas = politicasData[moduloId];
            if (!mod) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'mm', format: 'a4' });
            const PW = 210, PH = 297;
            const ML = 15, MR = 15;
            const TW = PW - ML - MR;

            // Paleta exacta
            const TEAL    = [23,165,152];
            const TEAL_LT = [235,247,245];
            const GR_HDR  = [245,245,245];

            const GR_TXT  = [51,51,51];
            const GR_LT   = [130,130,130];
            const BLK     = [0,0,0];
            const WHT     = [255,255,255];
            const DK      = [26,26,46];
            const COVER   = [58,68,82];

            // Helpers
            const hl=(x,y,w,c,lw)=>{ doc.setDrawColor(...(c||GR_SEP)); doc.setLineWidth(lw||0.3); doc.line(x,y,x+w,y); };
            const fl=(x,y,w,h,c)=>{ doc.setFillColor(...c); doc.rect(x,y,w,h,'F'); };
            const tx=(t,x,y,fnt,sz,c,opts)=>{ doc.setFont('helvetica',fnt||'normal'); doc.setFontSize(sz||9); doc.setTextColor(...(c||GR_TXT)); doc.text(String(t||''),x,y,opts||{}); };

            const fecha = new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'});
            const folio = 'POL-' + Date.now().toString().slice(-6);

            // ===== PORTADA (PAG 1) =====
            fl(0,0,PW,PH,WHT);
            fl(0,PH-70,PW,70,[68,83,106]);
            tx('SSEPI', PW/2, PH-48, 'bold', 28, WHT, {align:'center'});
            tx('Soluciones de Servicios Enterprise', PW/2, PH-38, 'normal', 11, TEAL, {align:'center'});
            tx(mod.nombre, PW/2, 90, 'bold', 22, WHT, {align:'center'});
            tx('Políticas y Condiciones del Servicio', PW/2, 102, 'normal', 12, [180,190,200], {align:'center'});
            tx('Bulevard Zodiaco 336, Los Limones, C.P. 37448, León, Guanajuato, México', PW/2, PH-22, 'normal', 9, [160,170,180], {align:'center'});
            tx('ventas@ssepi.org  |  www.ssepi.org', PW/2, PH-15, 'normal', 9, [160,170,180], {align:'center'});
            tx('Folio: ' + folio, PW/2, PH-8, 'normal', 8, [140,150,160], {align:'center'});

            // ===== HEADER REUSABLE =====
            const HH = 47;
            const FY = PH - 16;
            const drawHeader = () => {
                const HR = 38.2;
                const DX1 = 74.5;
                const DX2 = 91.0;
                const px = v => v.toFixed(2);
                const py = v => (PH - v).toFixed(2);
                try {
                    doc.setFillColor(239,246,246);
                    doc.internal.write(
                        `${px(0)} ${py(0)} m `+
                        `${px(PW)} ${py(0)} l `+
                        `${px(PW)} ${py(HR)} l `+
                        `${px(DX2)} ${py(HR)} l `+
                        `${px(88.6)} ${py(39.5)} l `+
                        `${px(80.0)} ${py(46.9)} l `+
                        `${px(DX1)} ${py(HH)} l `+
                        `${px(0)} ${py(HH)} l `+
                        `h f`
                    );
                } catch(e) {
                    fl(0,0,PW,HH,[239,246,246]);
                }
                // Logo SSEPI
                try { tx('SSEPI', 9, 20, 'bold', 13, TEAL); } catch(_){}
                // Dirección
                tx('Bulevard Zodiaco 336, Los Limones,',  PW-5, 13, 'normal', 9, [100,115,125], {align:'right'});
                tx('C.P. 37448, León, Guanajuato, México', PW-5, 20, 'normal', 9, [100,115,125], {align:'right'});
                // Tagline
                doc.setFont('helvetica','italic');
                doc.setFontSize(8.5);
                doc.setTextColor(0x3F,0x9E,0x9E);
                const tagLines = doc.splitTextToSize('Conectamos ingeniería, tecnología y productividad industrial', 63);
                const tagY0 = tagLines.length > 1 ? 39.0 : 42.0;
                tagLines.forEach((l,i) => doc.text(l, 9, tagY0 + i*4.2));
                // Folio derecha

                const rightZoneW = PW - DX2 - 6;

                doc.setFont('helvetica','normal');

                while(doc.getTextWidth(folioLabel) > rightZoneW - 2 && fsz > 10){ fsz--; doc.setFontSize(fsz); }
                doc.setTextColor(0x3F,0x9E,0x9E);
                doc.text(folioLabel, PW-5, HR-2, {align:'right'});
                return HH + 5;
            };

            // ===== FOOTER REUSABLE =====
            const drawFooter = (pn) => {

            const parseNota = (str, idx) => {
                const n = (idx + 1) + '.';

            const NL = 5.0;

            }

            notas.forEach(nota => {
                doc.setFont('helvetica','normal'); doc.setFontSize(9);
                const full = (nota.pre || '') + (nota.b || '') + (nota.post || '');
                const lines = doc.splitTextToSize(full, NMAX);
                const nH = lines.length * NL + 2;
                if (y + nH > BODY_BOTTOM) newPageSolo();

                doc.setFont('helvetica','normal'); doc.setFontSize(9);
                doc.setTextColor(...GR_TXT);
                doc.text(nota.n, ML+2, y+4);

                if (!nota.b) {
                    lines.forEach((l, i) => doc.text(l, ML+10, y+4 + i*NL));
                } else {
                    let cx = ML + 10;
                    const ly = y + 4;
                    if (nota.pre) {
                        doc.setFont('helvetica','normal');
                        doc.text(nota.pre, cx, ly);
                        cx += doc.getTextWidth(nota.pre);
                    }
                    doc.setFont('helvetica','bold');
                    doc.text(nota.b, cx, ly);
                    cx += doc.getTextWidth(nota.b);
                    if (nota.post) {
                        doc.setFont('helvetica','normal');
                        const restW = ML + 10 + NMAX - cx;
                        const postLines = doc.splitTextToSize(nota.post, restW > 20 ? restW : NMAX);
                        doc.text(postLines[0] || '', cx, ly);
                        if (postLines.length > 1) {
                            const rem = postLines.slice(1).join(' ');
                            const remLines = doc.splitTextToSize(rem, NMAX);
                            remLines.forEach((l, i) => doc.text(l, ML+10, ly + (i+1)*NL));
                        }
                    }
                    const fullLines = doc.splitTextToSize(full, NMAX);
                    if (fullLines.length > 1 && nota.post) {
                        const allPostLines = doc.splitTextToSize(nota.post, NMAX);
                        if (allPostLines.length > 1) {
                            allPostLines.slice(1).forEach((l, i) => doc.text(l, ML+10, ly + (i+1)*NL));
                        }
                    }
                }
                y += nH;
            });

            // Términos link
            y += 6;
            if (y + 14 > BODY_BOTTOM) newPageSolo();
            doc.setFont('helvetica','normal'); doc.setFontSize(9);
            doc.setTextColor(...GR_TXT);
            const lbl = 'Para mayor información revise nuestros términos y condiciones en: ';
            doc.text(lbl, ML, y);
            doc.setTextColor(...TEAL);
            doc.text(politicas?.url_terminos || 'https://www.ssepi.org/terms', ML + doc.getTextWidth(lbl), y);

            // Footer final
            drawFooter(pgNum);

            ultimoDocPDF = doc;
            ultimoNombrePDF = `Politicas_${mod.nombre.replace(/\s+/g,'_')}_${folio}.pdf`;

            if (soloPreview) {
                abrirVistaPrevia(mod.nombre);
            } else {
                doc.save(ultimoNombrePDF);
                mostrarSuccess(`PDF descargado: ${ultimoNombrePDF}`);
            }
        }

        // ═══════════════════════════════════════════════════════════════════
        // VISTA PREVIA INLINE
        // ═══════════════════════════════════════════════════════════════════
        function abrirVistaPrevia(tituloModulo) {
            if (!ultimoDocPDF) return;
            const dataUri = ultimoDocPDF.output('datauristring');
            document.getElementById('previewFrame').src = dataUri;
            document.getElementById('previewTitle').textContent = `👁️ Vista previa: ${tituloModulo}`;
            document.getElementById('previewModal').classList.add('active');
        }

        function cerrarVistaPrevia() {
            document.getElementById('previewModal').classList.remove('active');
            document.getElementById('previewFrame').src = '';
        }

        function descargarPDFDesdePreview() {
            if (ultimoDocPDF && ultimoNombrePDF) {
                ultimoDocPDF.save(ultimoNombrePDF);
                mostrarSuccess(`PDF descargado: ${ultimoNombrePDF}`);
            }
        }

        // ═══════════════════════════════════════════════════════════════════
        // INICIALIZAR
        // ═══════════════════════════════════════════════════════════════════
        async function init() {
            await verificarSesion();
        }

        // Exponer funciones globalmente
        window.generarPDF = generarPDF;
        window.abrirEditor = abrirEditor;
        window.cerrarEditor = cerrarEditor;
        window.agregarNota = agregarNota;
        window.guardarPoliticas = guardarPoliticas;
        window.abrirVistaPrevia = abrirVistaPrevia;
        window.cerrarVistaPrevia = cerrarVistaPrevia;
        window.descargarPDFDesdePreview = descargarPDFDesdePreview;

        // Iniciar
        init();
    </script>
</body>
</html>
