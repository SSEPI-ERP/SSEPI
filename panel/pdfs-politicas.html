<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSEPI - PDFs y Políticas por Módulo</title>
    <!-- Configuración centralizada de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/panel/js/core/supabase-config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 30px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            margin-bottom: 30px;
        }
        header h1 {
            color: #17a598;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        header p {
            color: #828282;
            font-size: 1.1rem;
        }
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        .module-card {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        .module-card:hover {
            transform: translateY(-5px);
        }
        .module-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .module-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .module-title {
            flex: 1;
        }
        .module-title h2 {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 5px;
        }
        .module-title .tiempo-entrega {
            font-size: 0.9rem;
            color: #17a598;
            font-weight: 500;
        }
        .politicas-section {
            margin-bottom: 20px;
        }
        .politicas-section h3 {
            font-size: 1rem;
            color: #17a598;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nota-item {
            padding: 10px 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #444;
            border-left: 3px solid #17a598;
        }
        .nota-item strong {
            color: #17a598;
        }
        .garantia-badge {
            display: inline-block;
            padding: 6px 12px;
            background: linear-gradient(135deg, #17a598, #0d9488);
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .pdf-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }
        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #17a598, #0d9488);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(23, 165, 152, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .btn-edit {
            background: #2196f3;
            color: white;
        }
        .btn-edit:hover {
            background: #1976d2;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #828282;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top-color: #17a598;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-msg {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .success-msg {
            background: #efe;
            color: #060;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        /* Login Screen */
        body.login-active {
            overflow: hidden;
        }
        .login-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .login-screen.active {
            display: flex;
        }
        .login-box {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .login-box h2 {
            color: #17a598;
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        .login-box p {
            text-align: center;
            color: #828282;
            margin-bottom: 30px;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .login-form input {
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .login-form input:focus {
            outline: none;
            border-color: #17a598;
        }
        .login-error {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }

        /* Modal Editor */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .modal-header h2 {
            color: #333;
            font-size: 1.5rem;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #888;
        }
        .modal-close:hover {
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #17a598;
            box-shadow: 0 0 0 3px rgba(23, 165, 152, 0.1);
        }
        .nota-editor-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .nota-editor-item textarea {
            width: 100%;
            min-height: 60px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }
        .btn-save {
            background: linear-gradient(135deg, #17a598, #0d9488);
            color: white;
        }
        .btn-cancel {
            background: #e0e0e0;
            color: #333;
        }

        /* Modal Vista Previa PDF */
        .preview-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .preview-overlay.active {
            display: flex;
        }
        .preview-box {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 900px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #1a1a2e;
            color: white;
        }
        .preview-header h3 {
            margin: 0;
            font-size: 1.1rem;
        }
        .preview-frame {
            flex: 1;
            border: none;
            width: 100%;
        }
        .preview-actions {
            display: flex;
            gap: 10px;
            padding: 12px 20px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #828282;
            font-size: 0.9rem;
        }
        footer a {
            color: #17a598;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <div>
                    <h1>📄 SSEPI - PDFs y Políticas por Módulo</h1>
                    <p>Genera documentos con las políticas actualizadas de cada departamento</p>
                </div>
                <button onclick="window.location.href='/panel/panel.html'" class="btn btn-secondary" style="max-width:180px;">
                    🏠 Volver al Panel
                </button>
            </div>
        </header>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Cargando políticas desde la base de datos...</p>
        </div>

        <div id="error" class="error-msg" style="display:none;"></div>
        <div id="success" class="success-msg" style="display:none;"></div>

        <div id="modulesGrid" class="modules-grid" style="display:none;"></div>

        <footer>
            <p>SSEPI - Soluciones de Servicios Enterprise</p>
            <p>Términos y condiciones: <a href="https://www.ssepi.org/terms" target="_blank">ssepi.org/terms</a></p>
        </footer>
    </div>

    <!-- Modal Vista Previa PDF -->
    <div id="previewModal" class="preview-overlay">
        <div class="preview-box">
            <div class="preview-header">
                <h3 id="previewTitle">👁️ Vista previa del PDF</h3>
                <button onclick="cerrarVistaPrevia()" style="background:none;border:none;color:white;font-size:24px;cursor:pointer;">&times;</button>
            </div>
            <iframe id="previewFrame" class="preview-frame"></iframe>
            <div class="preview-actions">
                <button class="btn btn-primary" onclick="descargarPDFDesdePreview()">
                    ⬇️ Descargar PDF
                </button>
                <button class="btn btn-cancel" onclick="cerrarVistaPrevia()">
                    ❌ Cerrar
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Editor de Políticas -->
    <div id="editorModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">✏️ Editar Políticas</h2>
                <button class="modal-close" onclick="cerrarEditor()">&times;</button>
            </div>

            <div class="form-group">
                <label>Módulo</label>
                <input type="text" id="editModulo" readonly>
            </div>

            <div class="form-group">
                <label>Título</label>
                <input type="text" id="editTitulo" placeholder="Ej: Políticas para reparación de...">
            </div>

            <div class="form-group">
                <label>Tiempo de entrega</label>
                <input type="text" id="editTiempoEntrega" placeholder="Ej: INMEDIATA a partir de la OC">
            </div>

            <div class="form-group">
                <label>Garantía (días)</label>
                <input type="number" id="editGarantiaDias" min="0" max="365">
            </div>

            <div class="form-group">
                <label>Moneda</label>
                <input type="text" id="editMoneda" placeholder="Ej: MONEDA NACIONAL">
            </div>

            <div class="form-group">
                <label>URL de términos</label>
                <input type="url" id="editUrlTerminos" placeholder="https://www.ssepi.org/terms">
            </div>

            <div class="form-group">
                <label>Notas Importantes (una por línea)</label>
                <div id="notasEditor"></div>
                <button type="button" class="btn btn-secondary" onclick="agregarNota()" style="margin-top: 10px;">
                    ➕ Agregar nota
                </button>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-save" onclick="guardarPoliticas()">
                    💾 Guardar cambios
                </button>
                <button type="button" class="btn btn-cancel" onclick="cerrarEditor()">
                    ❌ Cancelar
                </button>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════
        // CONFIGURACIÓN DE SUPABASE
        // Usa la configuración centralizada de supabase-config.js
        // ═══════════════════════════════════════════════════════════════════
        const sb = window.supabase;
        const { jsPDF } = window.jspdf;

        let politicasData = {};
        let moduloActualEditando = null;
        let usuarioActual = null;

        // ═══════════════════════════════════════════════════════════════════
        // SESIÓN (heredada del panel — si no hay sesión, redirige al panel)
        // ═══════════════════════════════════════════════════════════════════
        async function verificarSesion() {
            try {
                const { data } = await sb.auth.getSession();
                if (data?.session) {
                    usuarioActual = data.session.user;
                    _entrarModulo();
                    return;
                }
            } catch (e) {
                console.warn('[PDFs] getSession falló:', e.message);
            }

            // Fallback: verificar token en localStorage (el panel usa Supabase Auth)
            const hasToken = !!localStorage.getItem('sb-knzmdwjmrhcoytmebdwa-auth-token') ||
                             !!localStorage.getItem('sb-foytizbicwnndegeorny-auth-token');
            if (hasToken && sb) {
                try {
                    const { data: { user }, error } = await sb.auth.getUser();
                    if (user && !error) {
                        usuarioActual = user;
                        _entrarModulo();
                        return;
                    }
                } catch (e) {
                    console.warn('[PDFs] getUser fallback falló:', e.message);
                }
            }

            // Sin sesión: redirigir al panel (que maneja login centralizado)
            window.location.replace('/panel/panel.html');
        }

        function _entrarModulo() {
            cargarPoliticas().then(ok => {
                if (ok) renderModules();
            });
            document.getElementById('loading').style.display = 'none';
        }

        // ═══════════════════════════════════════════════════════════════════
        // DATOS DE MÓDULOS
        // ═══════════════════════════════════════════════════════════════════
        const MODULES = [
            {
                id: 'taller_electronica',
                nombre: 'Taller Electrónica',
                icon: '🔧',
                color: '#467d32',
                colorHex: [70, 125, 50]
            },
            {
                id: 'taller_motores',
                nombre: 'Taller Motores',
                icon: '⚙️',
                color: '#ef6c00',
                colorHex: [239, 108, 0]
            },
            {
                id: 'ventas_suministros',
                nombre: 'Ventas y Suministros',
                icon: '📦',
                color: '#ff9800',
                colorHex: [255, 152, 0]
            },
            {
                id: 'automatizacion',
                nombre: 'Automatización',
                icon: '🤖',
                color: '#6a1b9a',
                colorHex: [106, 27, 154]
            },
            {
                id: 'soporte_planta',
                nombre: 'Soporte a Planta',
                icon: '🛠️',
                color: '#d32f2f',
                colorHex: [211, 47, 47]
            }
        ];

        // ═══════════════════════════════════════════════════════════════════
        // CARGAR POLÍTICAS DESDE BD
        // ═══════════════════════════════════════════════════════════════════
        async function cargarPoliticas() {
            try {
                const { data, error } = await supabase
                    .from('politicas_modulos')
                    .select('*')
                    .eq('activo', true);

                if (error) throw error;

                politicasData = {};
                (data || []).forEach(p => {
                    politicasData[p.modulo] = p;
                });

                return true;
            } catch (e) {
                console.error('Error cargando políticas:', e);
                mostrarError('Error cargando políticas: ' + e.message);
                return false;
            }
        }

        // ═══════════════════════════════════════════════════════════════════
        // MOSTRAR MENSAJES
        // ═══════════════════════════════════════════════════════════════════
        function mostrarError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }

        function mostrarSuccess(msg) {
            const el = document.getElementById('success');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        // ═══════════════════════════════════════════════════════════════════
        // RENDERIZAR MÓDULOS
        // ═══════════════════════════════════════════════════════════════════
        function renderModules() {
            const grid = document.getElementById('modulesGrid');
            grid.innerHTML = '';

            MODULES.forEach(mod => {
                const políticas = politicasData[mod.id];

                const card = document.createElement('div');
                card.className = 'module-card';
                card.innerHTML = `
                    <div class="module-header">
                        <div class="module-icon" style="background: ${mod.color}">${mod.icon}</div>
                        <div class="module-title">
                            <h2>${mod.nombre}</h2>
                            <div class="tiempo-entrega">${políticas?.tiempo_entrega || 'N/A'}</div>
                        </div>
                    </div>

                    ${políticas ? `<div class="garantia-badge">📋 Garantía: ${políticas.garantia_dias || 0} días</div>` : ''}

                    <div class="politicas-section">
                        <h3>📌 Políticas</h3>
                        ${políticas?.notas_importantes?.map((nota, i) => `
                            <div class="nota-item">
                                <strong>${i + 1}.</strong> ${nota}
                            </div>
                        `).join('') || '<p style="color:#888">Sin políticas configuradas</p>'}
                    </div>

                    <div class="pdf-actions">
                        <button class="btn btn-primary" onclick="generarPDF('${mod.id}', true)">
                            👁️ Vista previa
                        </button>
                        <button class="btn btn-secondary" onclick="generarPDF('${mod.id}')">
                            ⬇️ Descargar
                        </button>
                        <button class="btn btn-edit" onclick="abrirEditor('${mod.id}')">
                            ✏️ Editar
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });

            grid.style.display = 'grid';
            document.getElementById('loading').style.display = 'none';
        }

        // ═══════════════════════════════════════════════════════════════════
        // ABRIR/CERRAR EDITOR
        // ═══════════════════════════════════════════════════════════════════
        function abrirEditor(moduloId) {
            const mod = MODULES.find(m => m.id === moduloId);
            const politicas = politicasData[moduloId];

            if (!mod) return;

            moduloActualEditando = moduloId;

            document.getElementById('editModulo').value = mod.nombre;
            document.getElementById('editTitulo').value = politicas?.titulo || '';
            document.getElementById('editTiempoEntrega').value = politicas?.tiempo_entrega || '';
            document.getElementById('editGarantiaDias').value = politicas?.garantia_dias || 0;
            document.getElementById('editMoneda').value = politicas?.moneda || 'MONEDA NACIONAL';
            document.getElementById('editUrlTerminos').value = politicas?.url_terminos || '';

            // Notas
            const notasContainer = document.getElementById('notasEditor');
            notasContainer.innerHTML = '';

            const notas = politicas?.notas_importantes || [];
            notas.forEach((nota, idx) => {
                agregarNotaEditor(nota);
            });

            document.getElementById('modalTitle').textContent = `✏️ Editar: ${mod.nombre}`;
            document.getElementById('editorModal').classList.add('active');
        }

        function cerrarEditor() {
            document.getElementById('editorModal').classList.remove('active');
            moduloActualEditando = null;
        }

        function agregarNota() {
            agregarNotaEditor('');
        }

        function agregarNotaEditor(texto = '') {
            const container = document.getElementById('notasEditor');
            const div = document.createElement('div');
            div.className = 'nota-editor-item';
            div.innerHTML = `
                <textarea placeholder="Escribe la nota aquí...">${texto}</textarea>
                <button type="button" class="btn btn-cancel" onclick="this.parentElement.remove()" style="margin-top: 5px; padding: 6px 12px; font-size: 12px;">
                    🗑️ Eliminar
                </button>
            `;
            container.appendChild(div);
        }

        // ═══════════════════════════════════════════════════════════════════
        // GUARDAR POLÍTICAS
        // ═══════════════════════════════════════════════════════════════════
        async function guardarPoliticas() {
            if (!moduloActualEditando) return;

            const titulo = document.getElementById('editTitulo').value.trim();
            const tiempoEntrega = document.getElementById('editTiempoEntrega').value.trim();
            const garantiaDias = parseInt(document.getElementById('editGarantiaDias').value) || 0;
            const moneda = document.getElementById('editMoneda').value.trim();
            const urlTerminos = document.getElementById('editUrlTerminos').value.trim();

            // Obtener notas
            const notas = [];
            document.querySelectorAll('#notasEditor textarea').forEach(el => {
                const texto = el.value.trim();
                if (texto) notas.push(texto);
            });

            if (!titulo || !tiempoEntrega) {
                alert('El título y tiempo de entrega son requeridos');
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('politicas_modulos')
                    .upsert({
                        modulo: moduloActualEditando,
                        titulo,
                        tiempo_entrega: tiempoEntrega,
                        garantia_dias: garantiaDias,
                        moneda,
                        url_terminos: urlTerminos,
                        notas_importantes: notas,
                        updated_at: new Date().toISOString()
                    }, {
                        onConflict: 'modulo'
                    })
                    .select()
                    .single();

                if (error) throw error;

                // Actualizar caché local
                politicasData[moduloActualEditando] = data;

                // Re-renderizar
                renderModules();

                mostrarSuccess('Políticas guardadas correctamente');
                cerrarEditor();
            } catch (e) {
                console.error('Error guardando políticas:', e);
                alert('Error guardando: ' + e.message);
            }
        }

        // ═══════════════════════════════════════════════════════════════════
        // GENERAR PDF (con vista previa inline)
        // ═══════════════════════════════════════════════════════════════════
        let ultimoDocPDF = null;
        let ultimoNombrePDF = '';

        async function generarPDF(moduloId, soloPreview = false) {
            const mod = MODULES.find(m => m.id === moduloId);
            const politicas = politicasData[moduloId];

            if (!mod) return;

            const doc = new jsPDF({ unit: 'mm', format: 'a4' });
            const PW = 210, PH = 297;
            const ML = 15, MR = 15;
            const TW = PW - ML - MR;

            // Paleta premium
            const TEAL    = [23, 165, 152];
            const TEAL_LT = [235, 247, 245];
            const GR_HDR  = [245, 245, 245];
            const GR_TXT  = [80, 80, 80];
            const DK      = [26, 26, 46];

            let y = 20;
            const fecha = new Date().toLocaleDateString('es-MX');
            const folio = `POL-${Date.now().toString().slice(-6)}`;

            // ===== HEADER PREMIUM =====
            doc.setFillColor(...mod.colorHex);
            doc.roundedRect(ML, 8, TW, 28, 5, 5, 'F');

            // Logo placeholder (texto)
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(20);
            doc.setTextColor(255, 255, 255);
            doc.text(`${mod.icon} SSEPI`, ML + 8, 24);

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(11);
            doc.text(`${mod.nombre} — Políticas y Condiciones`, ML + 8, 32);

            // Folio y fecha a la derecha
            doc.setFontSize(9);
            doc.text(`Folio: ${folio}`, PW - MR - 5, 20, { align: 'right' });
            doc.text(`Fecha: ${fecha}`, PW - MR - 5, 26, { align: 'right' });

            y = 45;

            // ===== INFO BOXES =====
            if (politicas?.tiempo_entrega) {
                doc.setFillColor(...TEAL_LT);
                doc.roundedRect(ML, y, TW, 14, 3, 3, 'F');
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(10);
                doc.setTextColor(...TEAL);
                doc.text(`⏱️  Tiempo de entrega: ${politicas.tiempo_entrega}`, ML + 8, y + 9);
                y += 22;
            }

            if (politicas?.garantia_dias && politicas.garantia_dias > 0) {
                doc.setFillColor(255, 243, 224);
                doc.roundedRect(ML, y, TW, 14, 3, 3, 'F');
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(10);
                doc.setTextColor(200, 100, 0);
                doc.text(`📋  Garantía: ${politicas.garantia_dias} días`, ML + 8, y + 9);
                y += 22;
            }

            if (politicas?.moneda) {
                doc.setFillColor(240, 240, 255);
                doc.roundedRect(ML, y, TW, 12, 3, 3, 'F');
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(10);
                doc.setTextColor(80, 80, 180);
                doc.text(`💰  Moneda: ${politicas.moneda}`, ML + 8, y + 8);
                y += 18;
            }

            // ===== TÍTULO POLÍTICAS =====
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(14);
            doc.setTextColor(...DK);
            doc.text('📌  Políticas y Condiciones del Servicio', ML, y);
            y += 12;

            // Línea separadora
            doc.setDrawColor(...TEAL);
            doc.setLineWidth(0.8);
            doc.line(ML, y - 4, ML + 80, y - 4);

            // ===== LISTADO DE NOTAS =====
            if (politicas?.notas_importantes && politicas.notas_importantes.length > 0) {
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(10);
                doc.setTextColor(...GR_TXT);

                politicas.notas_importantes.forEach((nota, idx) => {
                    const bullet = `${idx + 1}.`;
                    const lines = doc.splitTextToSize(nota, TW - 15);

                    if (y + (lines.length * 5.5) > PH - 40) {
                        doc.addPage();
                        y = 20;
                    }

                    // Fondo alternado suave
                    if (idx % 2 === 0) {
                        doc.setFillColor(250, 250, 250);
                        doc.roundedRect(ML - 2, y - 3, TW + 4, (lines.length * 5.5) + 6, 2, 2, 'F');
                    }

                    doc.setFont('helvetica', 'bold');
                    doc.setTextColor(...TEAL);
                    doc.text(bullet, ML + 2, y + 4);

                    doc.setFont('helvetica', 'normal');
                    doc.setTextColor(...GR_TXT);
                    doc.text(lines, ML + 12, y + 4);
                    y += lines.length * 5.5 + 8;
                });
            } else {
                doc.setFont('helvetica', 'italic');
                doc.setFontSize(10);
                doc.setTextColor(150, 150, 150);
                doc.text('No hay políticas configuradas para este módulo.', ML, y);
            }

            y += 10;

            // ===== URL TÉRMINOS =====
            if (politicas?.url_terminos) {
                if (y > PH - 50) { doc.addPage(); y = 20; }
                doc.setFont('helvetica', 'italic');
                doc.setFontSize(9);
                doc.setTextColor(100, 100, 200);
                doc.text(`Más información: ${politicas.url_terminos}`, ML, y);
            }

            // ===== FOOTER PREMIUM =====
            const footerY = PH - 12;
            doc.setDrawColor(220, 220, 220);
            doc.setLineWidth(0.5);
            doc.line(ML, footerY - 8, PW - MR, footerY - 8);

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);
            doc.setTextColor(130, 130, 130);
            doc.text('SSEPI — Soluciones de Servicios Enterprise', ML, footerY);
            doc.text(`Documento generado el ${fecha} • Folio ${folio}`, PW - MR, footerY, { align: 'right' });

            // Guardar referencia para preview/descarga
            ultimoDocPDF = doc;
            ultimoNombrePDF = `Politicas_${mod.nombre.replace(/\s+/g, '_')}_${folio}.pdf`;

            if (soloPreview) {
                abrirVistaPrevia(mod.nombre);
            } else {
                doc.save(ultimoNombrePDF);
                mostrarSuccess(`PDF descargado: ${ultimoNombrePDF}`);
            }
        }

        // ═══════════════════════════════════════════════════════════════════
        // VISTA PREVIA INLINE
        // ═══════════════════════════════════════════════════════════════════
        function abrirVistaPrevia(tituloModulo) {
            if (!ultimoDocPDF) return;
            const dataUri = ultimoDocPDF.output('datauristring');
            document.getElementById('previewFrame').src = dataUri;
            document.getElementById('previewTitle').textContent = `👁️ Vista previa: ${tituloModulo}`;
            document.getElementById('previewModal').classList.add('active');
        }

        function cerrarVistaPrevia() {
            document.getElementById('previewModal').classList.remove('active');
            document.getElementById('previewFrame').src = '';
        }

        function descargarPDFDesdePreview() {
            if (ultimoDocPDF && ultimoNombrePDF) {
                ultimoDocPDF.save(ultimoNombrePDF);
                mostrarSuccess(`PDF descargado: ${ultimoNombrePDF}`);
            }
        }

        // ═══════════════════════════════════════════════════════════════════
        // INICIALIZAR
        // ═══════════════════════════════════════════════════════════════════
        async function init() {
            await verificarSesion();
        }

        // Exponer funciones globalmente
        window.generarPDF = generarPDF;
        window.abrirEditor = abrirEditor;
        window.cerrarEditor = cerrarEditor;
        window.agregarNota = agregarNota;
        window.guardarPoliticas = guardarPoliticas;
        window.abrirVistaPrevia = abrirVistaPrevia;
        window.cerrarVistaPrevia = cerrarVistaPrevia;
        window.descargarPDFDesdePreview = descargarPDFDesdePreview;

        // Iniciar
        init();
    </script>
</body>
</html>
