version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ssepi-ollama
    restart: always
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - E:/SSEPI/ollama-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    dns:
      - 1.1.1.1
      - 8.8.8.8

  n8n:
    image: n8nio/n8n:1.82.0
    container_name: ssepi-n8n
    restart: always
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      # N8N_BASIC_AUTH_ACTIVE=true   # DESACTIVADO 2026-06-15 para que n8n use user-mgmt interno
      - N8N_BASIC_AUTH_USER=ssepi
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5679}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=America/Mexico_City
      - TZ=America/Mexico_City
      - N8N_METRICS=true
      - N8N_DIAGNOSTICS_ENABLED=false
      # API pública para importar workflows vía CLI (activada 2026-06-15)
      - N8N_PUBLIC_API=true
      # Variables accesibles en workflows como $env.X
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-db:
        condition: service_healthy
      ollama:
        condition: service_started
    dns:
      - 1.1.1.1
      - 8.8.8.8

  n8n-db:
    image: postgres:16-alpine
    container_name: ssepi-n8n-db
    restart: always
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD}
    volumes:
      - n8n_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    dns:
      - 1.1.1.1
      - 8.8.8.8

volumes:
  n8n_data:
  n8n_pgdata: